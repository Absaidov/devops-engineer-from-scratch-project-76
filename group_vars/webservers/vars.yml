---
redmine_port: 3000
redmine_image: redmine:7.0.2-bookworm
redmine_container_name: project-76-redmine
redmine_app_dir: /opt/project-76/redmine
redmine_certs_dir: "{{ redmine_app_dir }}/certs"
redmine_env_file: "{{ redmine_app_dir }}/.env"
redmine_files_volume: project-76-redmine-files

redmine_db_host: c-c9qukd7b82r2dvo7se5p.rw.mdb.yandexcloud.net
redmine_db_port: 6432
redmine_db_name: project76
redmine_db_username: project76
redmine_db_password: "{{ vault_redmine_db_password }}"
redmine_db_password_forbidden_pattern: "[\"\\\\]"
redmine_secret_key_base: "{{ vault_redmine_secret_key_base }}"

redmine_root_ca_url: https://storage.yandexcloud.net/cloud-certs/RootCA.pem
redmine_root_ca_path: "{{ redmine_certs_dir }}/RootCA.pem"
redmine_root_ca_container_path: /etc/redmine/RootCA.pem

datadog_api_key: "{{ vault_datadog_api_key }}"
datadog_site: datadoghq.com
datadog_agent_major_version: 7
datadog_enabled: true
datadog_remote_updates: false

datadog_config:
  tags:
    - env:production
    - service:redmine
    - project:project-76

datadog_checks:
  http_check:
    init_config: {}
    instances:
      - name: "redmine-{{ inventory_hostname }}"
        url: "http://127.0.0.1:{{ redmine_port }}/login"
        method: get
        timeout: 5
        http_response_status_code: 200
        collect_response_time: true
        include_content: false
        skip_proxy: true
        service: redmine
        tags:
          - env:production
          - service:redmine
